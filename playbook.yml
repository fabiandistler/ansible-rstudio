---
- name: Setup R and RStudio Server on localhost
  hosts: localhost
  become: true
  connection: local
  roles: # Install with ansible-galaxy install -r requirements.yml
    - r # Installs R
    - rstudio-server # Installs RStudio Server and deploys

  vars:
    r_install_dev: true # Allow building R from source

    # R development dependencies grouped by purpose
    r_install:
      # Build tools
      - build-essential  # GCC, make, and other build tools

      # Core R dependencies
      - libcurl4-openssl-dev  # HTTP/HTTPS support (curl, httr packages)
      - libxml2-dev           # XML parsing (xml2, rvest packages)
      - libssl-dev            # SSL/TLS encryption
      - libbz2-dev            # Compression support
      - liblzma-dev           # XZ compression
      - libpcre2-dev          # Perl-compatible regular expressions
      - zlib1g-dev            # Compression library

      # Graphics and visualization
      - libfontconfig1-dev    # Font configuration
      - libpng-dev            # PNG image support
      - libjpeg-dev           # JPEG image support
      - libtiff-dev           # TIFF image support
      - libharfbuzz-dev       # Text shaping (ggplot2)
      - libfribidi-dev        # Bidirectional text (ggplot2)
      - libfreetype6-dev      # Font rendering (ggplot2)
      - libmagick++-dev       # ImageMagick (magick package)

      # Mathematical and statistical libraries
      - libgmp-dev            # GNU Multiple Precision (Rmpfr)
      - libgsl-dev            # GNU Scientific Library
      - libfftw3-dev          # Fast Fourier Transform
      - libicu-dev            # Unicode support

      # Scientific data formats
      - libhdf5-dev           # HDF5 file format (rhdf5 package)
      - libudunits2-dev       # Units of measurement (units package)

      # Spatial and GIS libraries
      - libproj-dev           # Cartographic projections (sf package)
      - libgeos-dev           # Geometry operations (sf package)
      - libgdal-dev           # Geospatial data (sf, rgdal packages)

      # X11 graphics
      - libxt-dev             # X11 toolkit
      - xorg-dev              # X.Org development files

      # Documentation and publishing
      - texinfo               # GNU documentation format
      - texlive-base          # Basic LaTeX
      - texlive-latex-base    # LaTeX base packages
      - texlive-fonts-recommended  # LaTeX fonts
      - texlive-fonts-extra   # Additional LaTeX fonts
      - texlive-latex-extra   # Extra LaTeX packages
      - pandoc                # Universal document converter (rmarkdown)

    rstudio_user: "{{ ansible_user | default('fd') }}" # Replace with target RStudio user's name


    preferences:
      save_workspace: "never"
      load_workspace: false
      always_save_history: false
      restore_last_project: false
      jobs_tab_visibility: "shown"
      insert_matching: false
      insert_native_pipe_operator: true
      highlight_selected_line: true
      highlight_r_function_calls: true
      rainbow_parentheses: true
      tab_multiline_completion: true
      check_unexpected_assignment_in_function_call: true
      show_diagnostics_other: true
      syntax_color_console: true
      auto_expand_error_tracebacks: true
      console_double_click_select: true
      editor_theme: "Idle Fingers"
      help_font_size_points: 11
      font_size_points: 12
      visual_markdown_editing_show_doc_outline: false
      visual_markdown_editing_show_margin: true
      spelling_dictionary_language: "en_GB"
      panes:
        quadrants:
          - Source
          - Console
          - TabSet1
          - TabSet2
        tabSet1:
          - Environment
          - History
          - Build
          - VCS
          - Connections
          - Presentation
        tabSet2:
          - Files
          - Plots
          - Packages
          - Help
          - Viewer
          - Presentations
        hiddenTabSet:
          - Tutorial
        console_left_on_top: false
        console_right_on_top: true
        additional_source_columns: 0
      show_invisibles: true
      source_with_echo: true
      show_hidden_files: true
      rmd_viewer_type: "pane"
      global_theme: "alternate"

    keybindings:
      styler::style_active_file: "Ctrl+-"
      golem::run_dev: "Ctrl++"
      devtools::test_active_file: "Ctrl+T"

  tasks:
    # Pre-flight checks
    - name: Verify target user exists
      ansible.builtin.command: id {{ rstudio_user }}
      register: user_check
      changed_when: false
      failed_when: user_check.rc != 0
      tags:
        - always
        - preflight

    - name: Check if required roles are available
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.ansible/roles/{{ item }}"
      register: role_check
      loop:
        - r
        - rstudio-server
      failed_when: not role_check.stat.exists
      become: false
      tags:
        - always
        - preflight

    - name: Display detected user information
      ansible.builtin.debug:
        msg:
          - "Configuring RStudio for user: {{ rstudio_user }}"
          - "User home directory: /home/{{ rstudio_user }}"
      tags:
        - always
        - preflight

    # RStudio configuration tasks
    - name: Ensure the RStudio preferences directory exists
      ansible.builtin.file:
        path: /home/{{ rstudio_user }}/.config/rstudio
        state: directory
        mode: "0755"
        owner: "{{ rstudio_user }}"
        group: "{{ rstudio_user }}"
      become: false
      tags:
        - config
        - preferences

    - name: Check if rstudio-prefs.json already exists
      ansible.builtin.stat:
        path: /home/{{ rstudio_user }}/.config/rstudio/rstudio-prefs.json
      register: rstudio_prefs_stat
      become: false
      tags:
        - config
        - preferences

    - name: Backup existing rstudio-prefs.json
      ansible.builtin.copy:
        src: /home/{{ rstudio_user }}/.config/rstudio/rstudio-prefs.json
        dest: /home/{{ rstudio_user }}/.config/rstudio/rstudio-prefs.json.backup.{{ ansible_date_time.epoch }}
        remote_src: true
        owner: "{{ rstudio_user }}"
        group: "{{ rstudio_user }}"
        mode: "0644"
      when: rstudio_prefs_stat.stat.exists
      become: false
      tags:
        - config
        - preferences

    - name: Create or update rstudio-prefs.json
      ansible.builtin.copy:
        dest: /home/{{ rstudio_user }}/.config/rstudio/rstudio-prefs.json
        content: |
          {{ preferences | to_nice_json }}
        owner: "{{ rstudio_user }}"
        group: "{{ rstudio_user }}"
        mode: "0644"
      notify: restart rstudio-server
      become: false
      tags:
        - config
        - preferences

    - name: Ensure the keybindings directory exists
      ansible.builtin.file:
        path: /home/{{ rstudio_user }}/.config/rstudio/keybindings
        state: directory
        mode: "0755"
        owner: "{{ rstudio_user }}"
        group: "{{ rstudio_user }}"
      become: false
      tags:
        - config
        - keybindings

    - name: Check if addins.json already exists
      ansible.builtin.stat:
        path: /home/{{ rstudio_user }}/.config/rstudio/keybindings/addins.json
      register: addins_stat
      become: false
      tags:
        - config
        - keybindings

    - name: Backup existing addins.json
      ansible.builtin.copy:
        src: /home/{{ rstudio_user }}/.config/rstudio/keybindings/addins.json
        dest: /home/{{ rstudio_user }}/.config/rstudio/keybindings/addins.json.backup.{{ ansible_date_time.epoch }}
        remote_src: true
        owner: "{{ rstudio_user }}"
        group: "{{ rstudio_user }}"
        mode: "0644"
      when: addins_stat.stat.exists
      become: false
      tags:
        - config
        - keybindings

    - name: Create or update addins.json
      ansible.builtin.copy:
        dest: /home/{{ rstudio_user }}/.config/rstudio/keybindings/addins.json
        content: |
          {{ keybindings | to_nice_json }}
        owner: "{{ rstudio_user }}"
        group: "{{ rstudio_user }}"
        mode: "0644"
      notify: restart rstudio-server
      become: false
      tags:
        - config
        - keybindings

    - name: Verify RStudio Server is running
      ansible.builtin.service:
        name: rstudio-server
        state: started
      register: rstudio_status
      retries: 3
      delay: 5
      until: rstudio_status is succeeded
      tags:
        - service
        - verify

    - name: Display RStudio Server access information
      ansible.builtin.debug:
        msg:
          - "RStudio Server is now running!"
          - "Access URL: http://localhost:8787/"
          - "Login with your Linux user credentials (user: {{ rstudio_user }})"
      tags:
        - always


  handlers:
    - name: restart rstudio-server
      ansible.builtin.service:
        name: rstudio-server
        state: restarted
